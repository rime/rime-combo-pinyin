# Rime schema
# encoding: utf-8

schema:
  schema_id: combo_pinyin_steno
  name: 宮保並擊術
  version: '4.0'
  author:
    - 居戎氏 <chen.sst@gmail.com>
  description: |
    宮保拼音並擊術
    節奏明快又直觀
    一擊一個中文字
    能分平翹與尖團
    標準設備廣兼容
    六鍵無衝七指禪
    速記千宗歸簡易
    音韻萬變列琴盤

    https://github.com/rime/home/wiki/ComboPinyin
  dependencies:
    - luna_pinyin

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
    abbrev: [ 中, Ａ ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: simplification
    states: [ 漢字, 汉字 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - streaming_chord_processor  # 實現並擊按鍵處理
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - simplifier
    - uniquifier

editor:
  bindings:
    # 退格鍵刪除一個拼音音節
    BackSpace: back_syllable
    # 回車鍵確認當前候選
    Return: confirm

streaming_chord:
  initial_keys: XSCZHLFGDBKTP
  final_keys: YIUVANREO
  canonicalize:
    - xform/[XY]//
    - reorder SCZHLFGDBKTPIUVANREO
    - xform/^.+$/[$0]/

  chord_duration_ms: 60           # 雙手和弦落鍵容差窗口
  chord_timeout_ms: 120           # 連打音節超時切分
  key_map:
    # 左手聲母區
    s: S
    w: C
    x: Z
    d: H
    e: L
    c: F
    f: G
    r: D
    v: B
    g: K
    t: T
    b: P
    # 右手韻母區
    j: I
    u: U
    m: V  # 輸入碼爲單字節的 V，顯示爲 Ü
    k: N
    i: R
    l: E
    o: O
    # 拇指 (空格鍵映射爲 A)
    space: A
    # 閒置領地
    q: 'X'
    a: 'X'
    z: 'X'
    'y': 'Y'
    h: 'Y'
    'n': 'Y'
    p: 'Y'

speller:
  # 字母表納入單音節定界符
  alphabet: 'SCZHLFGDBKTPIUVANREOXY[]'
  delimiter: " '"
  algebra:
    # 一些容錯
    - derive/^([bpmf])o$/$1uo/
    #- derive/^([dtngkhzcsr]h?)uo$/$1o/
    #- derive/iao$/io/
    - derive/^([nl])ei$/$1uei/
    - derive/^([nlzcs])ong$/$1iong/
    - derive/^([zcsr]h?)([aoe])/$1i$2/
    - derive/^([zcsr]h?)e(ng?)$/$1i$2/

    # 缺省韻母
    # 省略⟨u⟩
    - derive/^([bpf])u$/$1/
    # 省略⟨e⟩
    - derive/^([mdtnlgkh])e$/$1/
    # 省略舌尖元音⟨ï⟩
    - xform/^([zcs]h?|r)i$/$1/
    #- derive/^([zcs]h?|r)i$/$1/
    # 舌尖元音⟨ï⟩（通常省略）可明確輸入爲 R
    #- xform/^([zcsr]h?)i$/$1R/

    # ⟨er⟩自成音節
    - xform/^er/R/

    # ⟨uang⟩ 有 UARO, UANE 兩種形式
    - derive/[wu]ang/UARO/
    - xform/ang/ANE/
    # ⟨iong⟩ 有 IRO, ÜNE 兩種形式
    - derive/[yi]ong/VNE/
    - xform/[yi]ong/IRO/
    # ⟨ueng, ong⟩ 有 URO, UNE 兩種形式
    - derive/[wu]eng|ong/UNE/
    - xform/[wu]eng|ong/URO/
    - xform/y?ing/INE/
    - xform/eng/NE/

    - xform/an/AN/
    - xform/yun|ün|vn/VN/
    - xform/[wu]en|un/UN/
    - xform/y?in/IN/
    - xform/en/N/

    - xform/[yi]ou|iu/IR/
    - xform/[wu]ei|ui/UR/
    - xform/ao/AO/
    - xform/ou/RO/
    # IAR 保留爲 ⟨iai⟩ 音的並擊碼
    - xform/ai/AR/
    # ⟨ei⟩ RE 與前三組聲母搭配，可減省爲 R
    - derive/^([bpmfdtnlgkh])ei/$1R/
    - xform/ei/RE/
    # 零聲母音節 ⟨a⟩ 特殊規定爲並擊 AE，空格鍵單擊仍爲空格
    - derive/^a$/AE/

    # ⟨ju, qu, xu⟩ 的介音爲 ü，用 Ü 輸入
    - xform/^([jqx])[uU]/$1V/

    - xform/^yu/V/
    - xform/^yi?/I/
    - xform/^wu?/U/

    # 碼表中的拼音 v ü、宮保並擊碼 Ü 在棱鏡索引中轉寫爲 V
    - xlit/aoeiuvüÜ/AOEIUVVV/

    # 並擊聲母
    - xform/^zh/ZF/
    - xform/^ch/CL/
    - xform/^sh/SH/
    - xform/^m/FB/
    - xform/^n/LD/
    - xform/^r/HG/
    # 特殊配列鍵盤用
    #- derive/^p/ZB/
    #- derive/^t/CD/
    #- derive/^k/SG/
    # 若分尖團，⟨j, q, x⟩ 也可用 Z,C,S 與 I/Ü 相拼
    - derive/^j([IV])/Z$1/
    - derive/^q([IV])/C$1/
    - derive/^x([IV])/S$1/
    # 獨立聲母鍵
    - xlit/bpfdtlgkhjqxzcs/BPFDTLGKHGKHZCS/

    # 派生單音節定界閉包
    - derive/^.+$/[$0]/

translator:
  dictionary: combo_pinyin_steno
  enable_completion: false
  canonicalize:
    - xform/[XY]//
    # 將亂序落鍵的輸入音節標準化爲宮保拼音鍵序用於棱鏡檢索
    - reorder SCZHLFGDBKTPIUVANREO
  preedit_format:
    - xform/\[(\w+)\]/$1/
    # 將亂序落鍵的輸入音節標準化爲宮保拼音鍵序顯示
    - reorder SCZHLFGDBKTPIUVANREO
    # 恢復宮保並擊碼 Ü 的標準形式
    - xlit/V/Ü/

punctuator:
  import_preset: symbols

recognizer:
  patterns:
    punct: '^/([0-9]0?|[A-Za-z]+)$'

key_binder:
  import_preset: default
  bindings:
    # 不用 , . 翻頁
    - { when: paging, accept: comma, send: comma }
    - { when: has_menu, accept: period, send: period }

__patch:
  # 使用八股文語言模型
  - grammar:/hant?

  # 用家自選配置
  - combo_pinyin_steno.custom:/patch?
